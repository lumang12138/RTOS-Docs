name: Build melonDS 1.1 zh-CN

on:
  push:
    branches:
      - ci/melonds-zhcn-1.1
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out localization build files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools/melonds_zhcn
          sparse-checkout-cone-mode: false

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          pacboy: git:p gcc:p cmake:p ninja:p make:p python:p

      - name: Fetch official melonDS 1.1 source
        run: |
          git clone --branch 1.1 --depth 1 --recurse-submodules https://github.com/melonDS-emu/melonDS.git melonDS

      - name: Apply Simplified Chinese localization
        run: |
          python tools/melonds_zhcn/patch_melonds_zhcn.py melonDS
          python tools/melonds_zhcn/patch_direct_strings.py melonDS

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: melonds-1.1-vcpkg-x86_64-mingw-${{ hashFiles('melonDS/vcpkg.json') }}
          restore-keys: |
            melonds-1.1-vcpkg-x86_64-mingw-

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: melonDS/vcpkg.json

      - name: Configure melonDS
        run: |
          cd melonDS
          cmake --preset=release-mingw-x86_64 -DMELONDS_EMBED_BUILD_INFO=ON -DMELONDS_VERSION_SUFFIX=" zh-CN"

      - name: Build melonDS
        run: |
          cd melonDS
          cmake --build --preset=release-mingw-x86_64

      - name: Verify Chinese strings in executable
        run: |
          python - <<'PY'
          from pathlib import Path
          exe = Path('melonDS/build/release-mingw-x86_64/melonDS.exe').read_bytes()
          required = ['打开 ROM', '金手指设置', '视频设置', '系统', '配置']
          missing = [s for s in required if s.encode('utf-8') not in exe]
          if missing:
              raise SystemExit('Missing compiled zh-CN markers: ' + ', '.join(missing))
          print('Verified compiled Simplified Chinese UI markers.')
          PY

      - name: Stage distributable files
        run: |
          mkdir -p dist
          cp melonDS/build/release-mingw-x86_64/melonDS.exe dist/melonDS-1.1-zh_CN.exe
          cp melonDS/LICENSE dist/LICENSE-melonDS.txt
          cp tools/melonds_zhcn/patch_melonds_zhcn.py dist/patch_melonds_zhcn.py
          cp tools/melonds_zhcn/patch_direct_strings.py dist/patch_direct_strings.py
          cat > dist/README-zh_CN.txt <<'EOF'
          melonDS 1.1 简体中文 Windows x64 构建

          基线：melonDS 官方 1.1 标签
          平台：Windows x64 / MinGW UCRT64 / Qt 6
          汉化：主界面、菜单、设置窗口、金手指、输入、视频、音频、相机、固件、网络及常见提示信息。

          保留术语：ROM、BIOS、Firmware、JIT、OpenGL、DSi、Action Replay 等。
          本构建未包含任何游戏 ROM、BIOS 或固件文件。

          melonDS 依据 GNU GPL v3 或更高版本授权。
          附带两个 patch_*.py 文件，以公开本中文构建相对官方 1.1 的源码修改。
          EOF

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: melonDS-1.1-zh_CN-windows-x86_64
          path: dist/
          if-no-files-found: error

      - name: Save vcpkg cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: melonds-1.1-vcpkg-x86_64-mingw-${{ hashFiles('melonDS/vcpkg.json') }}
